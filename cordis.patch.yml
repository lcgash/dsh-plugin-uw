# dsh-union-workspace bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; install with
# `dsh plugin --profile <name> add link:~/code/dsh-union-workspace`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (union store, /api/dsh-union-workspace routes, preset
# application), and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client", served at /plugins/<id>/client.js) load
# in the web GUI.
- insert:
    - id: union-workspace
      name: 'dsh-union-workspace'